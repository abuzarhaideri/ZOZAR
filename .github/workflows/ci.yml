name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing useful to say, so cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      # A throwaway Postgres, not Aiven. CI must never touch the real database, and the
      # migrations have to prove they apply to an empty server from scratch.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zozar
          POSTGRES_PASSWORD: zozar
          POSTGRES_DB: zozar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U zozar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Local container, so TLS verification is neither available nor meaningful here.
      # Production refuses to start without DATABASE_CA_CERT; see src/db/client.ts.
      DATABASE_URL: postgres://zozar:zozar@localhost:5432/zozar_test?sslmode=disable
      JWT_SECRET: ci-only-secret-value-at-least-32-bytes-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the Lambda runtime, so CI type-checks against what actually ships.
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Migrations run first, against the service container while it is genuinely empty.
      # That is what proves they are valid; running them after the tests would only prove
      # they are a no-op on a schema the tests' own setup had already created.
      - name: Migrations apply to an empty database
        run: npm run db:migrate

      - name: Migrations are idempotent
        # Re-running must be a no-op. If this fails, a migration is not safe to retry
        # after a partial deploy.
        run: npm run db:migrate

      - name: Unit tests
        run: npm test

  bundle:
    name: Catalyst bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # Catalyst runs no build and no install of its own: it starts whatever the bundle
      # contains. A dependency missing from the bundle is reported by the platform only
      # as "check the startup command or port", with no mention of the module, so the
      # build script resolves every dependency and fails here instead.
      - name: Build the AppSail bundle
        run: ./scripts/build-catalyst.sh

      - name: The bundle starts and serves
        working-directory: catalyst/api
        run: |
          node index.js &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -sf -m 2 http://127.0.0.1:9000/health > /dev/null; then
              echo "health ok"; exit 0
            fi
            sleep 1
          done
          echo "the bundle never served /health"; exit 1

  app:
    name: App typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify palette contrast
        # A palette is the easiest part of a design system to break quietly: nudging a hex
        # value to taste can drop a label below the legibility floor and nothing looks
        # wrong on a bright monitor.
        run: npm run verify:contrast
